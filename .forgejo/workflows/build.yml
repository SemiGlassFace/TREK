name: Build & Push Container

on:
    push:
        branches: [automatic-build]
    workflow_dispatch:

jobs:
    build:
        runs-on: docker
        container:
            image: catthehacker/ubuntu:act-latest
        steps:
            - name: Checkout custom branch
              uses: actions/checkout@v4
              with:
                  ref: automatic-build
                  fetch-depth: 0
                  token: ${{ secrets.FORGEJO_TOKEN }}

            - name: Rebase onto latest main
              run: |
                  git config user.name "forgejo-actions[bot]"
                  git config user.email "forgejo-actions[bot]@noreply.git.semig.dev"
                  git fetch origin main
                  git rebase origin/main || {
                    echo "::error::Rebase failed — manual conflict resolution needed"
                    git rebase --abort
                    exit 1
                  }

            - name: Login to Forgejo Container Registry
              uses: docker/login-action@v3
              with:
                  registry: git.semig.dev
                  username: ${{ forge.actor }}
                  password: ${{ secrets.registry_token }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Read version
              id: version
              run: |
                  VERSION=$(grep '"version"' server/package.json | head -1 | sed 's/.*"version": *"\([^"]*\)".*/\1/')
                  echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64
                  push: true
                  build-args: |
                      APP_VERSION=${{ steps.version.outputs.VERSION }}
                  tags: |
                      git.semig.dev/semiglassface/trek:latest
                      git.semig.dev/semiglassface/trek:${{ steps.version.outputs.VERSION }}
